name: Build Android APK (fresh package)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build signed test APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature, package, SDK compatibility and alignment
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.basemn.markazajhizati.test2' versionCode='4' versionName='0.4.0'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/apk-badging.txt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: markaz-ajhizati-release-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
