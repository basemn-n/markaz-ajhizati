name: Build Android APK (fresh package)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build signed test APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Install APK on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.basemn.markazajhizati.test2

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: markaz-ajhizati-release-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
