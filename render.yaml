services:
  - type: web
    name: markaz-ajhizati-web
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web

  - type: web
    name: markaz-ajhizati-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MARKAZ_AUTH_SECRET
        generateValue: true
      - key: MARKAZ_WEB_ORIGIN
        value: https://markaz-ajhizati.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: markaz-ajhizati-db
          property: connectionString

databases:
  - name: markaz-ajhizati-db
    plan: free
    databaseName: markaz_ajhizati
    user: markaz_ajhizati
